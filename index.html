<!DOCTYPE html>
<html>
<head>
  <title>VLESS Configs</title>
</head>
<body>
  <pre id="out">Loading...</pre>

  <script>
    fetch("./vless.json")
      .then(r => r.json())
      .then(data => {
        document.getElementById("out").textContent =
          JSON.stringify(data, null, 2);
      });
  </script>
</body>
</html>
